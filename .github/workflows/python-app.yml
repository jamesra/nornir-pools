# Unit tests for nornir-pools across platforms.
# Tests live under ./tests (pytest). Do not point discovery at the retired ./test path.

name: Python application

on:
  push:
    branches: [ "master", "dev", "CuPy"]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  CURSES: "False"
  TERM: xterm
  ECLIPSE: ECLIPSE
  NORNIR_HEADLESS: "1"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install pytest
        python -m pip install .

    - name: Test with pytest
      run: python -m pytest -q ./tests
